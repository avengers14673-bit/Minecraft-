<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Block World</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  font-family:monospace;
  background:#071b12;
  color:white;
}

.scene{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(#071d35 0%,#164d61 48%,#67b35b 49%,#28753b 100%);
}

/* SUN */
.sun{
  position:absolute;
  width:90px;
  height:90px;
  background:#ffe66d;
  box-shadow:0 0 45px #ffe66d;
  right:12%;
  top:10%;
}

/* CLOUDS */
.cloud{
  position:absolute;
  width:150px;
  height:35px;
  background:#dff7ff;
  opacity:.8;
  animation:cloud 25s linear infinite;
}

.cloud:before,
.cloud:after{
  content:"";
  position:absolute;
  background:#dff7ff;
}

.cloud:before{
  width:55px;
  height:55px;
  left:25px;
  top:-25px;
}

.cloud:after{
  width:70px;
  height:70px;
  right:20px;
  top:-35px;
}

.cloud.one{top:18%;left:-180px;}
.cloud.two{top:30%;left:-400px;animation-delay:8s;}

@keyframes cloud{
  to{transform:translateX(130vw);}
}

/* MOUNTAINS */
.mountain{
  position:absolute;
  bottom:32%;
  width:0;
  height:0;
  border-left:180px solid transparent;
  border-right:180px solid transparent;
  border-bottom:300px solid #315d46;
}

.m1{left:5%;}
.m2{left:38%;transform:scale(1.3);}
.m3{right:-5%;transform:scale(.9);}

/* GROUND */
.ground{
  position:absolute;
  bottom:0;
  width:100%;
  height:35%;
  background:
    repeating-linear-gradient(
      90deg,
      #277b38 0 50px,
      #226d31 50px 100px
    );
  border-top:12px solid #68452b;
}

.ground:before{
  content:"";
  position:absolute;
  top:0;
  width:100%;
  height:22px;
  background:#4cae43;
}

/* BLOCKS */
.block{
  position:absolute;
  width:65px;
  height:65px;
  background:#76502e;
  border:5px solid #4c321d;
  box-shadow:inset 0 10px #8f653c
