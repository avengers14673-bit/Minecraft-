<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Minecraft Visiting Card</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at center, #183b16 0%, #071007 35%, #020402 80%);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: Arial, sans-serif;
    overflow: hidden;
    color: white;
}

.title {
    color: #9cff00;
    font-size: clamp(22px, 5vw, 38px);
    font-weight: bold;
    text-shadow:
        0 0 8px #5cff00,
        0 0 20px #5cff00;
    margin-bottom: 8px;
}

.subtitle {
    color: #c9d8c9;
    font-size: 14px;
    margin-bottom: 25px;
}

/* CARD AREA */

.card-container {
    width: min(90vw, 700px);
    aspect-ratio: 89 / 51;
    perspective: 1500px;
}

.card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.85s cubic-bezier(.2,.75,.2,1);
    cursor: pointer;
}

.card.flipped {
    transform: rotateY(180deg);
}

/* FRONT + BACK */

.card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;

    border-radius: 10px;
    overflow: hidden;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;

    border: 2px solid #9cff00;

    box-shadow:
        0 0 5px #9cff00,
        0 0 20px #5cff00,
        0 20px 50px rgba(0,0,0,.8);

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
}

/* FRONT */

.front {
    background-image: url("front.png");
}

/* BACK */

.back {
    background-image: url("back.png");
    transform: rotateY(180deg);
}

/* SHINE EFFECT */

.card-face::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            120deg,
            rgba(255,255,255,0.10),
            transparent 25%,
            transparent 70%,
            rgba(255,255,255,0.04)
        );

    pointer-events: none;
}

/* BUTTON */

.flip-button {
    margin-top: 22px;

    padding: 10px 20px;

    border: 1px solid #9cff00;
    border-radius: 30px;

    background: #071207;
    color: #baff65;

    font-size: 14px;
    font-weight: bold;

    box-shadow:
        0 0 10px #5cff0044,
        inset 0 0 10px #5cff0022;

    text-shadow: 0 0 8px #9cff00;
}

/* MOBILE */

@media(max-width:600px) {

    body {
        padding: 15px;
    }

    .subtitle {
        margin-bottom: 18px;
    }

    .card-container {
        width: 94vw;
    }

    .card-face {
        border-radius: 7px;
    }

    .flip-button {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="title">
    ⛏️ MINECRAFT CARD
</div>

<div class="subtitle">
    Tap the card to flip
</div>

<div class="card-container">

    <div class="card" id="card">

        <!-- FRONT -->
        <div class="card-face front"></div>

        <!-- BACK -->
        <div class="card-face back"></div>

    </div>

</div>

<div class="flip-button">
    TAP / CLICK TO FLIP ↻
</div>


<script>

const card = document.getElementById("card");

card.addEventListener("click", function () {
    card.classList.toggle("flipped");
});

</script>

</body>
</html>
